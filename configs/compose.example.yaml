version: '3.8'

networks:
  local_network:
    driver: bridge

volumes:
  db_volume:
    name: postgres_data
  redis_volume:
    name: redis_data
  mongo_data:

services:
  mongo-db:
    image: mongo:latest
    container_name: mongo_db
    restart: "unless-stopped"
    env_file:
      - path: .env
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${DB__USER}
      - MONGO_INITDB_ROOT_PASSWORD=${DB__PASSWORD}
      - MONGO_INITDB_DATABASE=${DB__NAME}
      - MONGOT_LOG_FILE=/dev/stderr
      - RUNNER_LOG_FILE=/dev/stderr
    networks:
      - local_network
    ports:
      - "*{DB__PORT}:*{DB__PORT}"
    volumes:
      - ./configs/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      - mongo_data:/data/db 

  redis:
    image: redis:7-alpine
    container_name: anomer_redis
    restart: "unless-stopped"
    networks:
      - local_network
    ports:
      - "*{REDIS__PORT}:*{REDIS__PORT}"
    volumes:
      - redis_volume:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS__PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5